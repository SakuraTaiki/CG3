# リポジトリ内の不要なファイルを見つけるためのGitHub Actions
name: CheckUnwantedFiles

on:
  # GitHubActionsタブから手動で実行できるようにする
  workflow_dispatch:
  # masterブランチへのプッシュでも実行する
  push:
    branches:
      - master

# 検出する不要なファイルのパターンを定義する環境変数
#
# プロジェクトのニーズに合わせて、これらのリストを変更してください。
# パターンはスペース区切りで指定します。
env:
  # 特定のファイル（拡張子など）のパターン
  UNWANTED_NAME_PATTERNS: "*.pdb *.ilk *.user *.ncb *.suo *.log *.dmp *.zip imgui.ini desktop.ini dxcompiler.dll dxil.dll"

  # ディレクトリ名のパターン（ビルド出力フォルダなど）
  UNWANTED_DIR_PATTERNS: "generated x64 win32 arm64 .vs bin ipch logs Dump"

jobs:
  check-files:
    name: 不要なファイルを検出
    runs-on: ubuntu-latest

    steps:
      # リポジトリをチェックアウト
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      # 不要なファイルとディレクトリを検索
      - name: 不要なファイルを検出（bash）
        run: |
          # ディレクトリ条件を構築（最初が不要 → -o を後で削除）
          DIR_CONDITIONS=()
          for pattern in $UNWANTED_DIR_PATTERNS; do
            DIR_CONDITIONS+=(-o -iname "$pattern")
          done
          unset DIR_CONDITIONS[0]

          # ファイル条件を構築（最初が不要 → -o を後で削除）
          NAME_CONDITIONS=()
          for pattern in $UNWANTED_NAME_PATTERNS; do
            NAME_CONDITIONS+=(-o -iname "$pattern")
          done
          unset NAME_CONDITIONS[0]

          # find の and 条件を検索
          # 1. -git を除外
          # 2. 不要なディレクトリを検索（-type d し、見つけたパスを出力(-print)し、その中身を枝刈り(-prune)）
          # 3. または (-o) 不要なファイルを検索 (-type f し、パスを出力(-print))
          UNWANTED_LIST=$(find . -path "./.git" -prune -o \
            \( \( "${DIR_CONDITIONS[@]}" \) -a -type d -print -prune \) -o \
            \( \( "${NAME_CONDITIONS[@]}" \) -a -type f -print \) \
          )

          # 検出結果があればエラーとして出力し、失敗させる
          if [ -n "$UNWANTED_LIST" ]; then
            echo "::error:: 以下の不要なファイルまたはディレクトリが見つかりました！"
            echo "$UNWANTED_LIST"
            exit 1
          fi

          echo "リポジトリはクリーンです。"